name: build

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          java: 8
          arch: arm64
          runner: ubuntu-24.04-arm
          expander_leg: ubuntu-latest-8-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Cache Maven Repos
      uses: actions/cache@v2
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ matrix.java }}
        architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
    - name: Build with Maven
      run: mvn --batch-mode --no-transfer-progress clean install 
        cobertura:cobertura -Dmaven.javadoc.skip=true
    - uses: codecov/codecov-action@v1
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
